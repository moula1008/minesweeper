<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初めてのマインスイーパー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">
    <div class="menu-container">
        <h1>はじめてのマインスイーパー</h1>
        
        <div class="guide-section">
            <h2>マインスイーパーの遊び方</h2>
            <p><strong>【ゲームの目的】</strong><br>
            隠された地雷を避けて、安全なマスをすべて開くパズルゲームです！</p>
            
            <p><strong>【基本のルールと操作】</strong></p>
            <ul>
                <li><strong>掘るモード：</strong>安全だと思うマスをタップして開きます。地雷を踏むとゲームオーバーです。</li>
                <li><strong>旗モード：</strong>「ここに地雷がある！」と思ったら、旗を立ててマークできます。</li>
                <li><strong>数字の意味：</strong>マスを開けたときに出る数字は、<strong>「そのマスのすぐ周囲（上下左右・斜め）にある地雷の数」</strong>を表しています。</li>
                <li><strong>地雷の数：</strong>簡単モードは約10%（1割）、その他のモードは約20%（2割）に配置されます。</li>
            </ul>
        </div>

        <div class="start-section">
            <!-- 簡単モードボタン：地雷1割（アシスト・救済なし） -->
            <button type="button" class="btn-primary btn-beginner" onclick="startBeginnerGame()">
                まずはここから！簡単モード (5×5) で遊ぶ
            </button>
        </div>

        <hr class="divider">

        <div class="normal-select-area">
            <label for="size"><strong>盤面サイズを選ぶ：</strong></label>
            <select id="size">
                <option value="5">5 × 5 (簡単)</option>
                <option value="10" selected>10 × 10 (普通)</option>
                <option value="15">15 × 15 (ちょっと難しい)</option>
                <option value="20">20 × 20 (上級者向け)</option>
            </select>
        </div>
        <div style="text-align: center;">
            <button type="button" class="btn-primary" onclick="startCustomGame()">選んだサイズでスタート</button>
        </div>
    </div>

    <script>
        function startBeginnerGame() {
            window.location.href = `game.html?size=5&mode=beginner`;
        }

        function startCustomGame() {
            const size = document.getElementById("size").value;
            window.location.href = `game.html?size=${size}`;
        }
    </script>
</body>
</html>
